name: fetch-gold-m1
on:
  push:
    branches: [data-fetch]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe
        run: curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" -A "Mozilla/5.0" --max-time 20 https://datafeed.dukascopy.com/datafeed/XAUUSD/2026/08/02/BID_candles_min_1.bi5 || true
      - name: Download XAUUSD M1 (Dukascopy, bid, GMT)
        shell: python
        run: |
          import urllib.request, lzma, struct, datetime as dt, csv, time, sys
          from concurrent.futures import ThreadPoolExecutor
          start, end = dt.date(2026, 1, 1), dt.date.today()
          days = [start + dt.timedelta(days=i) for i in range((end - start).days + 1)]
          def get(d):
              url = f"https://datafeed.dukascopy.com/datafeed/XAUUSD/{d.year}/{d.month-1:02d}/{d.day:02d}/BID_candles_min_1.bi5"
              for a in range(3):
                  try:
                      raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read()
                      out = []
                      if raw:
                          data = lzma.decompress(raw); base = dt.datetime(d.year, d.month, d.day)
                          for i in range(0, len(data), 24):
                              t, o, c, lo, hi, v = struct.unpack(">5if", data[i:i+24])
                              if v > 0: out.append([(base + dt.timedelta(seconds=t)).strftime("%Y-%m-%d %H:%M"), o/1000, hi/1000, lo/1000, c/1000, round(v, 4)])
                      return d, out, None
                  except Exception as e:
                      err = e; time.sleep(1)
              return d, [], str(err)
          rows, fails = [], []
          with ThreadPoolExecutor(12) as ex:
              for d, out, err in ex.map(get, days):
                  rows += out
                  if err and d.weekday() < 5: fails.append((str(d), err))
          print("fails", len(fails), fails[:5]); print("rows", len(rows), rows[0] if rows else None, rows[-1] if rows else None); sys.stdout.flush()
          with open("xauusd_m1_gmt.csv", "w", newline="") as f:
              w = csv.writer(f); w.writerow(["time_gmt", "open", "high", "low", "close", "volume"]); w.writerows(rows)
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-m1
          path: xauusd_m1_gmt.csv
