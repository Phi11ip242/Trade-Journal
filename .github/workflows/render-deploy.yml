# Tells Render to deploy every time something lands on main.
# Needs one repo secret: RENDER_DEPLOY_HOOK = the Deploy Hook URL from
# Render → Trade-Journal → Settings → Deploy. Without the secret it does nothing.
name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy started."
